<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="echoBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D1C13" />
      <stop offset="60%" stop-color="#1A0D07" />
      <stop offset="100%" stop-color="#0B0402" />
    </radialGradient>
    <radialGradient id="heartPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FF7875" />
      <stop offset="80%" stop-color="#CF1322" />
      <stop offset="100%" stop-color="#490E08" />
    </radialGradient>
    <linearGradient id="goldStroke5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD59A" />
      <stop offset="50%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#7B541C" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="400" height="400" rx="24" fill="url(#echoBg)" />
  <rect width="396" height="396" x="2" y="2" rx="22" fill="none" stroke="url(#goldStroke5)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ondes de battements cardiaques (Doppler) -->
  <path d="M70,260 L140,260 L150,240 L160,285 L175,215 L190,295 L200,245 L210,260 L330,260" 
        fill="none" stroke="#FFA940" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Sac gestationnel & embryon -->
  <ellipse cx="200" cy="155" rx="75" ry="60" fill="#140804" stroke="#7A4B2E" stroke-width="2" />
  <!-- Vésicule vitelline -->
  <circle cx="175" cy="160" r="14" fill="none" stroke="#FFE7BA" stroke-width="1.8" opacity="0.85" />
  
  <!-- Petit embryon -->
  <path d="M195,140 C215,140 225,160 215,175 C205,185 190,175 195,165 Z" fill="#FFE58F" opacity="0.9" />

  <!-- Cœur clignotant / battant en pulsation -->
  <circle cx="202" cy="155" r="9" fill="url(#heartPulse)" />
  <circle cx="202" cy="155" r="18" fill="none" stroke="#FF4D4F" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,3" />

  <!-- Rythme cardiaque / BPM badge -->
  <rect x="135" y="70" width="130" height="26" rx="13" fill="#201008" stroke="#FFA940" stroke-width="1.2" />
  <text x="200" y="87" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#FFE58F" letter-spacing="1">♥ 145 BPM · ACTIF</text>

  <!-- Cartouche / Badge du bas -->
  <rect x="50" y="325" width="300" height="44" rx="14" fill="#201008" stroke="#C89B3C" stroke-width="1.2" stroke-opacity="0.6" />
  <text x="200" y="344" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFE6A3" letter-spacing="1">1ÈRE ÉCHOGRAPHIE DU CŒUR</text>
  <text x="200" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" fill="#D8BE9B">L'émotion pure des premiers battements</text>
</svg>
