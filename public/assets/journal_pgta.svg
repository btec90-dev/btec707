<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3D2314" />
      <stop offset="60%" stop-color="#24130A" />
      <stop offset="100%" stop-color="#120804" />
    </radialGradient>
    <radialGradient id="embryoGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="30%" stop-color="#FFD166" />
      <stop offset="70%" stop-color="#D48B3C" />
      <stop offset="100%" stop-color="#8C4B18" />
    </radialGradient>
    <radialGradient id="cellGlow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#E19D38" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD59A" />
      <stop offset="50%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#7B541C" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="400" height="400" rx="24" fill="url(#bgGlow)" />
  <rect width="396" height="396" x="2" y="2" rx="22" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Particules d'ambiance féconde -->
  <circle cx="90" cy="110" r="2.5" fill="#FFE8A3" opacity="0.4" />
  <circle cx="310" cy="90" r="3" fill="#FFE8A3" opacity="0.35" />
  <circle cx="80" cy="290" r="2" fill="#FFE8A3" opacity="0.4" />
  <circle cx="320" cy="280" r="2.5" fill="#FFE8A3" opacity="0.3" />
  <circle cx="200" cy="70" r="1.5" fill="#FFE8A3" opacity="0.5" />

  <!-- Halo lumineux externe du blastocyste -->
  <circle cx="200" cy="190" r="115" fill="#FFC95C" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="200" cy="190" r="88" fill="none" stroke="#E6BE68" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.5" />
  <circle cx="200" cy="190" r="82" fill="none" stroke="#FFE49E" stroke-width="1" opacity="0.7" />

  <!-- Zone pellucide et trophoectoderme (cellules périphériques) -->
  <circle cx="200" cy="190" r="76" fill="url(#embryoGlow)" opacity="0.9" />

  <!-- Cellules du trophoblaste disposées en couronne -->
  <circle cx="145" cy="155" r="14" fill="url(#cellGlow)" opacity="0.75" />
  <circle cx="170" cy="135" r="13" fill="url(#cellGlow)" opacity="0.8" />
  <circle cx="205" cy="130" r="15" fill="url(#cellGlow)" opacity="0.85" />
  <circle cx="240" cy="140" r="14" fill="url(#cellGlow)" opacity="0.8" />
  <circle cx="260" cy="165" r="13" fill="url(#cellGlow)" opacity="0.75" />
  <circle cx="265" cy="198" r="14" fill="url(#cellGlow)" opacity="0.8" />
  <circle cx="250" cy="230" r="13" fill="url(#cellGlow)" opacity="0.75" />
  <circle cx="220" cy="250" r="15" fill="url(#cellGlow)" opacity="0.85" />
  <circle cx="180" cy="252" r="14" fill="url(#cellGlow)" opacity="0.8" />
  <circle cx="150" cy="235" r="13" fill="url(#cellGlow)" opacity="0.75" />
  <circle cx="138" cy="200" r="14" fill="url(#cellGlow)" opacity="0.8" />

  <!-- Cavité blastocœle -->
  <ellipse cx="215" cy="195" rx="36" ry="32" fill="#5A2E12" opacity="0.65" />

  <!-- Masse Cellulaire Interne (MCI / Bouton embryonnaire doré et scintillant) -->
  <g filter="url(#softGlow)">
    <circle cx="175" cy="178" r="22" fill="#FFFBE6" opacity="0.95" />
    <circle cx="170" cy="172" r="12" fill="#FFFFFF" opacity="0.9" />
    <circle cx="186" cy="184" r="10" fill="#FFE58F" opacity="0.85" />
  </g>

  <!-- Éclat étoile au cœur du bouton embryonnaire -->
  <path d="M172,160 L174,170 L184,172 L174,174 L172,184 L170,174 L160,172 L170,170 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Cartouche / Badge du bas -->
  <rect x="50" y="325" width="300" height="44" rx="14" fill="#201008" stroke="#C89B3C" stroke-width="1.2" stroke-opacity="0.6" />
  <text x="200" y="344" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFE6A3" letter-spacing="1">PGT-A · 8 BLASTOCYSTES</text>
  <text x="200" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" fill="#D8BE9B">Analyse génétique &amp; Vitalité embryonnaire</text>
</svg>
